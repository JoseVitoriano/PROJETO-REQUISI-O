<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Requisições</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#1d2330;--mut:#667085;--pri:#c2410c;--bd:#e4e7ec}
@media(prefers-color-scheme:dark)

{:root{
    --bg:#14171f;
    --card:#1d222d;
    --tx:#eef0f4;
    --mut:#98a2b3;
    --bd:#2c3342}}

*{
    box-sizing:border-box}

body{
    margin:0;
    font:15px system-ui,sans-serif;
    background:var(--bg);
    color:var(--tx)}

nav{
    display:flex;
    gap:16px;
    align-items:center;
    padding:12px 20px;
    background:var(--card);
    border-bottom:1px solid var(--bd);
    flex-wrap:wrap}

nav a{
    color:var(--tx);
    text-decoration:none;
    font-weight:600}nav .sp{flex:1}

main{
    max-width:1200px;
    margin:20px auto;
    padding:0 16px}

.card{
    background:var(--card);
    border:1px solid var(--bd);
    border-radius:10px;
    padding:18px;margin-bottom:16px}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:12px}

label{
    display:block;
    font-size:13px;color:var(--mut);
    margin-bottom:4px}

input,select,textarea{
    width:100%;
    padding:9px;
    border:1px solid var(--bd);
    border-radius:6px;
    background:var(--bg);
    color:var(--tx);
    font:inherit}

button,.btn{
    background:var(--pri);
    color:#fff;border:0;
    border-radius:6px;
    padding:9px 16px;
    font:inherit;
    cursor:pointer;
    text-decoration:none;
    display:inline-block}

.btn.sec{
    background:transparent;
    color:var(--tx);
    border:1px solid var(--bd)}

.kpi b{
    display:block;
    font-size:26px}.kpi span{color:var(--mut);
    font-size:13px}

.msg{
    background:#fef3c7;
    color:#78350f;
    padding:10px;
    border-radius:6px;
    margin-bottom:12px}

.tw{
    overflow-x:auto}table{border-collapse:collapse;
    width:100%;
    font-size:13px}

th,td{
    padding:8px;
    border-bottom:1px solid var(--bd);
    text-align:left;
    white-space:nowrap}

.bar{
    display:flex;
    align-items:center;
    gap:10px;
    margin:6px 0}.bar i{display:block;height:14px;background:var(--pri);border-radius:4px}

.bar span:first-child{
    width:170px;
    font-size:13px}

.bar i{background:var(--c,var(--pri))}

.btn-del{background:#dc2626;padding:4px 10px;font-size:12px}

.badge{
    display:inline-block;
    padding:2px 10px;
    border-radius:999px;
    font-size:12px;
    font-weight:600;
    color:#fff;
    background:var(--c,#475569)}

</style>
</head>
<body>
{% if session.user %}
<nav>
    <a href="{{ url_for('dashboard') }}">Dashboard</a>
    <a href="{{ url_for('lista') }}">Requisições</a>
    <a href="{{ url_for('formulario') }}">+ Nova</a>
    <span class="sp"></span>
    <span>{{ session.user }}</span>
<form method="post" action="{{ url_for('logout') }}">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <button class="sec btn">Sair</button>
</form>
</nav>{% endif %}
<main>{% for m in get_flashed_messages() %}<div class="msg">{{ m }}</div>{% endfor %}{% block c %}{% endblock %}
</main>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
